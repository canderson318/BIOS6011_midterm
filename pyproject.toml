[project]
name = "midterm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "canderson138", email = "christianjbanderson@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "multiprocess>=0.70.19",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotnine>=0.15.3",
    "rpy2>=3.6.9",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
midterm = "midterm:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
